<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      width: 100%;
      min-width: 280px;
      max-width: 360px;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 14px;
      box-sizing: border-box;
    }
    .intestazione {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
    .intestazione img {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      object-fit: cover;
    }
    .intestazione h2 {
      margin: 0;
      font-size: 16px;
      color: #38bdf8;
    }
    .sub {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .riga {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #1e293b;
      font-size: 13px;
    }
    .riga:last-child { border-bottom: none; }
    .btn-toggle {
      padding: 6px 14px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
    }
    .si { background-color: #10b981; color: #052e16; }
    .no { background-color: #ef4444; color: #ffffff; }
    .azioni-globali {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .btn-globale {
      flex: 1;
      padding: 10px 8px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      color: #ffffff;
    }
    #blocca-tutto { background-color: #0284c7; }
    #consenti-tutto { background-color: #334155; }
  </style>
</head>
<body>
  <div class="intestazione">
    <img src="preview.png" alt="Logo">
    <div>
      <h2>Anti-CookieSheep</h2>
      <div class="sub">SÌ = Bloccato | NO = Consentito</div>
    </div>
  </div>

  <div id="lista-recinti">
    <div class="riga"><span>🍪 Rifiuto Cookie Auto</span><button class="btn-toggle" data-id="cookie">SÌ</button></div>
    <div class="riga"><span>📘 Meta Pixel (FB/IG)</span><button class="btn-toggle" data-id="meta">SÌ</button></div>
    <div class="riga"><span>🎵 TikTok Pixel</span><button class="btn-toggle" data-id="tiktok">SÌ</button></div>
    <div class="riga"><span>✖️ X Pixel (Twitter)</span><button class="btn-toggle" data-id="x">SÌ</button></div>
    <div class="riga"><span>🔍 Google Ads & Analytics</span><button class="btn-toggle" data-id="google">SÌ</button></div>
    <div class="riga"><span>💼 LinkedIn Tag</span><button class="btn-toggle" data-id="linkedin">SÌ</button></div>
    <div class="riga"><span>📌 Pinterest Tag</span><button class="btn-toggle" data-id="pinterest">SÌ</button></div>
    <div class="riga"><span>👻 Snapchat Pixel</span><button class="btn-toggle" data-id="snapchat">SÌ</button></div>
    <div class="riga"><span>🪟 Microsoft / Bing</span><button class="btn-toggle" data-id="bing">SÌ</button></div>
    <div class="riga"><span>🛒 Criteo / Taboola</span><button class="btn-toggle" data-id="criteo">SÌ</button></div>
  </div>

  <div class="azioni-globali">
    <button id="blocca-tutto" class="btn-globale">Blocca Tutto</button>
    <button id="consenti-tutto" class="btn-globale">Consenti Tutto</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
